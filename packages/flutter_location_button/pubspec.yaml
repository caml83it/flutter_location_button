name: location_button
description: "A Flutter plugin for system-trusted location button."
version: 0.1.1
homepage: https://github.com/caml83it/flutter_location_button

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_location_button_platform_interface: ^0.1.0
  flutter_location_button_android: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_location_button_android
