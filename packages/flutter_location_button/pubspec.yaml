name: flutter_location_button
description: "A Flutter plugin for system-trusted location button."
version: 0.0.1
homepage: https://github.com/example/flutter_location_button

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_location_button_platform_interface:
    path: ../flutter_location_button_platform_interface
  flutter_location_button_android:
    path: ../flutter_location_button_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_location_button_android
